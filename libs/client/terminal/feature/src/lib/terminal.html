<section id="terminal">
  <div class="terminal-window">
    <header class="terminal-header">
      <div class="terminal-title">
        <div class="terminal-icon">></div>
        <span>Terminal</span>
      </div>

      <div class="terminal-actions">
        <div class="terminal-status">
          <span class="status-dot" [class]="serverStatus()"></span>
          <span [class]="serverStatus()">{{serverStatus()}}</span>
        </div>

        @if (serverStatus() === 'running') {
        <button
          class="terminal-button stop-button"
          type="button"
          (click)="stopServer(serverId()!)"
        >
          ■
          <span>Stop</span>
        </button>

        <button
          class="terminal-button restart-button"
          type="button"
          (click)="restartServer(server()!.id); $event.stopPropagation()"
        >
          ↻
          <span>Restart</span>
        </button>
        }@else if (serverStatus() === 'starting') {
        <button
          class="terminal-button stop-button"
          type="button"
          (click)="stopServer(serverId()!); $event.stopPropagation()"
        >
          ▶
          <span>Stop</span>
        </button>
        } @else {
        <button
          class="terminal-button start-button"
          type="button"
          [disabled]="busy()"
          (click)="startServer(serverId()!)"
        >
          ▶
          <span>Start</span>
        </button>
        }
      </div>
    </header>

    <cdk-virtual-scroll-viewport
      [itemSize]="lineHeight"
      [minBufferPx]="100"
      [maxBufferPx]="200"
      scrollDirective
      class="terminal-content"
    >
      <div
        *cdkVirtualFor="let cmd of terminalLines(); trackBy: trackByIndex"
        class="content"
      >
        <p [class]="cmd.consoleType">{{ cmd.text }}</p>
      </div>
    </cdk-virtual-scroll-viewport>

    <div class="terminal-input">
      <form (submit)="$event.preventDefault(); onSubmit()">
        <input
          type="text"
          [formField]="terminalForm.command"
          placeholder="Enter command..."
          autocomplete="off"
          spellcheck="false"
        />
      </form>
    </div>
  </div>
</section>
