<div class="modal-backdrop">
  <div class="create-modal">
    <div class="modal-header">
      <div>
        <h2>Create Server</h2>
        <p>Configure your new Minecraft server.</p>
      </div>

      <button
        type="button"
        class="close-btn"
        aria-label="Close"
        (click)="close()"
      >
        <i class="fa-solid fa-x"></i>
      </button>
    </div>

    <form (submit)="onSubmit()">
      <section class="form-section">
        <h3>Basic Information</h3>

        <!-- Server Name -->
        <div class="form-group">
          <label for="server-name">Server Name</label>

          <input
            id="server-name"
            type="text"
            placeholder="My Minecraft Server"
            [formField]="serverForm.name"
          />

          @if (serverForm.name().dirty() && serverForm.name().invalid()) {
          <span class="form-error"> Server name is required </span>
          }
        </div>

        <!-- Memory -->
        <div class="form-group">
          <label for="memory">Server Memory (MB)</label>

          <input
            id="memory"
            type="number"
            placeholder="4096"
            [formField]="serverForm.memoryMb"
          />
        </div>

        <div class="form-group">
          <lib-dropdown
            [label]="'Server type'"
            [id]="'server-type'"
            [FormField]="serverForm.type"
            [options]="serverTypes"
            (change)="onServerTypeChange()"
          />
        </div>

        <div class="form-group">
          <label for="directory">Server Directory (location)</label>

          <button
            class="btn-path"
            type="button"
            (click)="locatePath(); $event.stopImmediatePropagation()"
          >
            <i class="ti ti-folder"></i>
            <span class="btn-path-text"
              >{{ serverFormModel().serverDirectory || 'Example path D:\\Games'
              }}</span
            >
          </button>
        </div>

        <!-- Version -->
        <div class="form-group">
          <lib-dropdown
            [FormField]="serverForm.version"
            [label]="'Server version'"
            [id]="'server-version'"
            [options]="gameVersions()"
          />

          @if (serverForm.version().touched() && serverForm.version().invalid())
          {
          <span class="form-error"> Server version is required </span>
          }
        </div>

        <!-- gamemode -->
        <div class="form-group">
          <lib-dropdown
            [label]="'Gamemode'"
            [id]="'gamemode'"
            [FormField]="serverForm.gamemode"
            [options]="gamemodeOptions"
          />
        </div>

        <!-- players -->

        <div class="form-group">
          <lib-dropdown
            [label]="'Max players'"
            [id]="'max-players'"
            [FormField]="serverForm.maxPlayers"
            [options]="maxPlayersOptions"
          />
        </div>

        <div class="form-group">
          <lib-dropdown
            [label]="'White list'"
            [id]="'white-list'"
            [FormField]="serverForm.whitelist"
            [options]="booleans"
          />
        </div>

        <div class="form-group">
          <lib-dropdown
            [label]="'Enable PVP'"
            [id]="'pvp'"
            [FormField]="serverForm.pvp"
            [options]="booleans"
          />
        </div>

        <div class="form-group">
          <label for="worldSeed">World seed</label>

          <input id="worldSeed" [formField]="serverForm.worldSeed!" />
        </div>
      </section>

      <footer class="modal-footer">
        <button type="button" class="btn-cancel" (click)="close()">
          Cancel
        </button>

        <button type="submit" class="btn-submit">Create server</button>
      </footer>
    </form>
  </div>
</div>
